<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix Clone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <h1 class="logo">NETFLIX<span>CLONE</span></h1>
  </header>

  <main>
    <section class="catalogo">
      <h2>Populares</h2>
      <div id="peliculas" class="grid-peliculas">
        <!-- Las tarjetas de películas se insertan aquí con JavaScript -->
        <p id="mensaje-carga">Cargando catálogo...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>Proyecto académico &mdash; Clon de Netflix con consumo de la API de TMDB.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
